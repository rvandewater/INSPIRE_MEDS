[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "INSPIRE-MEDS"
version = "1.0.0"
authors = [
    {name="Robin van de Water", email="robin.vandewater@hpi.de"},
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
]
description = "An ETL pipeline to extract INSPIRE data into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling. Upstream narrowed to >=3.11.4,<3.14; a
# looser range here admits interpreters it cannot be installed on, and uv refuses to
# resolve at all ("the requested Python version (>=3.11) does not satisfy Python>=3.11.4,<3.14").
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# MEDS-Extract supplies both CLIs (`meds-extract-download`, `meds-extract-run`) and every
# extraction stage; 0.8.1 adds the `etl.pre_stages`/`post_stages` this spec runs, `_self` metadata
# on literal codes, and the `etl:` dataset descriptors (`license`, `description_uri`). It is capped
# below the next minor: MEDS-Extract 0.x minors are breaking (MESSY syntax, runner CLI), so raise
# this deliberately when migrating. polars builds the subject side table (the
# `inspire_subject_table` pre-stage). suMEDS 0.6.2 registers the `sumeds_enrich` post-stage, which
# enriches the finished code metadata with the rules registered below; it soft-fails (a failed
# enrichment, e.g. without internet, leaves the build as it was) and records the enrichment in
# `metadata/dataset.json`. It is capped below the next minor for the same reason (its rules format
# and output columns are still 0.x: 0.6 changed `*_names` to maps).
dependencies = [
  "MEDS-extract[download]>=0.8.1,<0.9",
  "polars>=1.0",
  "sumeds>=0.6.2,<0.7",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]
docs = [
  "mkdocs==1.6.0", "mkdocs-material==9.7.7", "mkdocstrings[python,shell]==0.25.2", "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.1", "mkdocs-section-index==0.3.9", "mkdocs-git-authors-plugin==0.9.0",
  "mkdocs-git-revision-date-localized-plugin==1.2.6"
]

# Deprecated alias of `meds-extract-run spec=INSPIRE`, kept for one release because 1.0.0 shipped it
# (see `INSPIRE_MEDS.__main__`). Remove it in the next release.
[project.scripts]
MEDS_extract-INSPIRE = "INSPIRE_MEDS.__main__:main"

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the complete build is
# `meds-extract-run spec=INSPIRE output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
INSPIRE = "INSPIRE_MEDS:messy.yaml"

# Registers the suMEDS rules under the same name, so the spec's `sumeds_enrich: {rules: INSPIRE}`
# and `suMEDS-enrich --rules INSPIRE` find them.
[project.entry-points."sumeds.rules"]
INSPIRE = "INSPIRE_MEDS:sumeds_rules.yaml"

# The pre-stage that builds the `subjects` side table (`etl.pre_stages`).
[project.entry-points."MEDS_transforms.stages"]
inspire_subject_table = "INSPIRE_MEDS.pre_MEDS:main"

[project.urls]
Homepage = "https://github.com/rvandewater/INSPIRE_MEDS"
Issues = "https://github.com/rvandewater/INSPIRE_MEDS/issues"
