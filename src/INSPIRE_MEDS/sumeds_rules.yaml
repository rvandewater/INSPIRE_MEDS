# suMEDS enrichment rules for INSPIRE_MEDS code metadata (https://github.com/rvandewater/SumMEDS).
#
# The ETL describes codes from INSPIRE's own tables and documentation. Vocabulary parent codes, and
# the official ICD-10-CM category titles, come from suMEDS. This file is registered in suMEDS's
# `sumeds.rules` entry-point group as `INSPIRE` (pyproject.toml); the spec's `sumeds_enrich`
# post-stage (`etl.post_stages` in messy.yaml) applies it as the last step of
# `meds-extract-run spec=INSPIRE`. To enrich an existing build later, or again:
#
#   suMEDS-enrich "$OUT"                   # with the rules and options its dataset.json records
#   suMEDS-enrich "$OUT" --rules INSPIRE   # a build made with skip_stages=[sumeds_enrich]
#
# Every pattern matches a code layout of `messy.yaml` exactly; tests/test_sumeds_rules.py checks
# them against example codes built from that config.
schema: sumeds-rules/0.1

ontology:
  # DIAGNOSIS//KCD//{edition}//{icd10_cm}: a KCD three-character category (edition 6, 7, 8, or UNK
  # while the release has no calendar dates). KCD is not in suMEDS's packs. Where ICD-10-CM has the
  # same category, it becomes the code's parent, with its CMS title in parent_names: a KCD category
  # and the ICD-10-CM category of the same code cover the same condition group (KCD follows WHO
  # ICD-10, and ICD-10-CM extends WHO ICD-10 below the category level). `validate: pack` drops the
  # KCD-only categories (71 in 1.4.2), which get no parent. The config writes a null code as UNK.
  - id: inspire-kcd-icd10cm-categories
    pattern: "^DIAGNOSIS//KCD//(?:[678]|UNK)//(?P<code>(?!UNK$)[A-Z][0-9A-Z]{2})$"
    vocabulary: ICD10CM
    validate: pack
  # ICD//10PCS//{icd10_pcs}: the first five ICD-10-PCS characters (section, body system, root
  # operation, body part, approach). suMEDS's ICD-10-PCS data holds every valid 1- to 6-character
  # prefix, described by its axis labels.
  - id: inspire-icd10pcs-prefixes
    pattern: "^ICD//10PCS//(?P<code>[0-9A-HJ-NP-Z]{5})$"
    vocabulary: ICD10PCS
    validate: pack
  # MEDICATION//{atc_code}//{route}: the release's own WHO ATC code, at any ATC level. ATC is
  # licensed and has no suMEDS data: tagged only, or validated by your own Athena download.
  - id: inspire-atc-medications
    pattern: "^MEDICATION//(?P<code>[A-Z](?:[0-9]{2}(?:[A-Z](?:[A-Z](?:[0-9]{2})?)?)?)?)//[^/]+$"
    vocabulary: ATC
    validate: none

hierarchy:
  # Same-dataset parents: the nearest shorter ATC code given by the same route that INSPIRE itself
  # contains, e.g. MEDICATION//N02BE//IV for MEDICATION//N02BE01//IV.
  - id: inspire-medication-atc-prefixes
    pattern: "^(?P<prefix>MEDICATION//)(?P<atc>[A-Z](?:[0-9]{2}(?:[A-Z](?:[A-Z](?:[0-9]{2})?)?)?)?)//[^/]+$"
    group: atc
    mode: prefix
