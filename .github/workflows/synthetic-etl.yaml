name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/e2e_synthetic_test.py, which checks specific values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and extract synthetic data
        # MESSY-synth 0.0.1 requires MEDS-Extract <0.8, while the ETL runs on 0.8, so it runs in a
        # tool environment of its own. It cannot parse 0.8's `_table.joins`, so it reads a copy of
        # the config with the key spelled `_table.join` (the only 0.8 syntax the config uses); the
        # extraction itself runs the shipped config with this project's locked MEDS-Extract.
        run: |
          sed 's/^    joins:$/    join:/' src/INSPIRE_MEDS/messy.yaml > messy_0.7.yaml
          uvx --python ${{ matrix.python-version }} --from "MESSY_synth==0.0.1" \
            MESSY-synth ./messy_0.7.yaml -o raw_synthetic/ --explain
          uv run --locked meds-extract-run spec=INSPIRE output_dir=./INSPIRE_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "INSPIRE_meds_synth/metadata/$f"
          done
