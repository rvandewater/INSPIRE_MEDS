# INSPIRE (PhysioNet 1.4.2) to MEDS. `meds-extract-run spec=INSPIRE ...` runs all of it: the
# `inspire_subject_table` pre-stage, the canonical MEDS-Extract stages, and suMEDS's
# `sumeds_link_unit_siblings`, `sumeds_normalize_units` and `sumeds_enrich` post-stages (see `etl:`).
#
# Code metadata: `_metadata` blocks describe every code family but the diagnoses, literal codes
# included (constant `_self` blocks, each with the source of its description). suMEDS adds the
# ICD-10-CM titles of the diagnoses and the vocabulary parent codes (sumeds_rules.yaml).
#
# Facts marked "INSPIRE team, 2026-11-22" come from the INSPIRE team (personal communication,
# 2026-11-22), to be corrected in the INSPIRE documentation from v1.5. README, "Source caveats
# (INSPIRE 1.4.2)", lists them with the counts measured on 1.4.2.

sources:
  dataset_version: 1.4.2

  dataset:
    - type: physionet
      base_url: https://physionet.org/files/inspire/${sources.dataset_version}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      unarchive: auto

etl:
  dataset_name: INSPIRE
  # Delete the <output_dir>/<stage> dirs after a successful run; keep: "overrides=['cleanup_intermediates=false']"
  cleanup_intermediates: true
  n_subjects_per_shard: 1000
  # metadata/dataset.json: the release's license, as PhysioNet names it, and its page.
  license: Korea Credentialed Health Data License-1-0-0
  description_uri: https://physionet.org/content/inspire/1.4.2/
  # The stay and operation ids (physionet:inspire-1.4.2: "A subject_id may be matched to one or
  # more hadm_ids", "A single hadm_id may be matched with one or more op_ids"):
  # - `hadm_id`, the hospital admission (operations.hadm_id), named as in the MIMIC-IV ETL and the
  #   other MEDS ETLs (rvandewater/alignEHR#55). It is on the admission and operation events of
  #   `operations`; the other tables carry no admission id.
  # - `operation_id`, the operation (operations.op_id), on the operation events of `operations`
  #   (times, ASA, emergency, department, anesthesia type, ICD-10-PCS, ...), so that the attributes
  #   of one of several operations on the same day can be told apart. Not on `vitals`, although
  #   vitals.op_id exists: where two operations overlap, the release repeats the same vital-sign
  #   rows under each op_id, which MEDS-Extract merges into one event today; an `operation_id`
  #   would turn every such event into one per operation (README, "Stay and operation ids").
  # Neither is on the subject-level events (birth, sex, race, death), nor on ICU_ADMISSION and
  # ICU_DISCHARGE: the release repeats one post-operative ICU stay on every operation it follows,
  # at times across more than one admission, so it belongs to no single operation or admission.
  # Weight, height and the admission and discharge events are per admission and carry only
  # `hadm_id`. The OPERATION_ID event keeps op_id in its text_value, as before.
  raw_source_id_columns: [hadm_id, operation_id]
  # Run before convert_to_parquet: builds the one-row-per-subject `subjects` table that
  # `operations` joins below, from the raw `operations` table (INSPIRE_MEDS.pre_MEDS).
  pre_stages:
    - inspire_subject_table
  # Run after the canonical stages: adds vocabulary titles and parent codes with suMEDS and records
  # it in metadata/dataset.json. It soft-fails (e.g. without internet); `suMEDS-enrich OUTPUT_DIR`
  # finishes it later. Leave it out with `skip_stages=[sumeds_enrich]`.
  post_stages:
    # First: suMEDS's shared stage gives codes that differ only in their last `//<unit>` part the
    # code without it as a parent, with a row of its own, and with `link_single_units` so does a
    # code ending in its unit whose item has one unit (default options otherwise;
    # https://github.com/rvandewater/suMEDS/blob/main/docs/unit_siblings.md). MEDS-Extract >= 0.9
    # already writes `unit` as one String per code. It runs before the enrichment, so the
    # enrichment, its coverage record and a later `suMEDS-enrich` retry all see the same table.
    - sumeds_link_unit_siblings:
        link_single_units: true
    # One UCUM spelling for every `unit` (suMEDS's shared table, e.g. `Cel`, `mm[Hg]`, `mg/dL`); the
    # spelling as recorded stays in `unit_source_value`, and an unknown spelling is kept as it is.
    - sumeds_normalize_units
    - sumeds_enrich:
        rules: INSPIRE

_defaults:
  subject_id: $subject_id

operations:
  _table:
    joins:
      # Written by the `inspire_subject_table` pre-stage; the release has no such table.
      subjects:
        key: subject_id
        cols: { birth_age: min, death_min: min }
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      # birth_age is the age at the first admission (the anchor, offset 0): the age recorded on its
      # earliest operation, which INSPIRE rounds to the nearest five years, less the days from the
      # anchor to that operation. The recorded age is the centre of its bin, so no offset is added
      # (inspire_subject_table pre-stage; alignEHR#54).
      date_of_birth: "$_origin - ($birth_age * 365.25)::days"
      date_of_death: "$_origin + $death_min::minutes"
      admission_t: "$_origin + $admission_time::minutes"
      icuin_t: "$_origin + $icuin_time::minutes"
      icuout_t: "$_origin + $icuout_time::minutes"
      orin_t: "$_origin + $orin_time::minutes"
      orout_t: "$_origin + $orout_time::minutes"
      opstart_t: "$_origin + $opstart_time::minutes"
      opend_t: "$_origin + $opend_time::minutes"
      discharge_t: "$_origin + $discharge_time::minutes"
      anstart_t: "$_origin + $anstart_time::minutes"
      anend_t: "$_origin + $anend_time::minutes"
      cpbon_t: "$_origin + $cpbon_time::minutes"
      cpboff_t: "$_origin + $cpboff_time::minutes"
      opdate_t: "$_origin + $opdate::minutes"
  op_id: # Number, A random number starts with 4 for the operation.
    code: OPERATION_ID
    time: $opstart_t
    hadm_id: $hadm_id
    operation_id: $op_id
    text_value: $op_id::str
    # Source: physionet:inspire-1.4.2 Anonymization (op_id values begin with 4); the column comment
    _metadata:
      _self:
        description: >-
          "Operation identifier, in text_value, recorded at the operation start (INSPIRE
          operations.op_id; a random number beginning with 4)"
  case_id: # Number, A linker to VitalDB Open Dataset
    code: VITALDB_CASE_ID
    time: null
    hadm_id: $hadm_id
    operation_id: $op_id
    text_value: $case_id::str
    # Source: the column comment (linker to the VitalDB open dataset); physionet:inspire-1.4.2
    # Parent Projects (VitalDB)
    _metadata:
      _self:
        description: >-
          "Identifier of the same case in the open VitalDB dataset, in text_value; a static
          (untimed) event (INSPIRE operations.case_id)"
  opdate: # Relative Time, Operation date
    code: OPERATION_DATE
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Date of the operation (INSPIRE operations.opdate)"'
  age: # Number, Age of the patient on the operation date
    code: MEDS_BIRTH
    time: $date_of_birth
    # Source: physionet:inspire-1.4.2 Anonymization (age in 5-year intervals); INSPIRE team,
    # 2026-11-22 (age rounded to the nearest five years, no top-coding); the
    # inspire_subject_table pre-stage (README Birth and death)
    _metadata:
      _self:
        description: >-
          "Birth (MEDS standard code); estimated as the date of the patient's first operation in
          their first admission minus the age recorded on it, which INSPIRE rounds to the nearest
          five years (operations.age; not top-coded, 90 is the highest level), so it is uncertain
          by up to 2.5 years"
  sex: # M/F, Sex of the patient
    code: 'f"SEX//{$sex ?? ''UNK''}"'
    time: null
    _metadata:
      _self:
        description: >-
          f"Sex of the patient: {$sex ?? 'UNK'} (INSPIRE operations.sex, M or F)"
  weight: # Number, Weight measured before operation
    code: WEIGHT
    numeric_value: $weight
    time: $admission_t
    hadm_id: $hadm_id
    # Source: the column comment; physionet:inspire-1.4.2 Anonymization (weight outside 10-200 kg
    # set to null)
    _metadata:
      _self:
        description: '"Body weight measured before the operation, kg (INSPIRE operations.weight)"'
        # The unit is not in the data. Source: physionet:inspire-1.4.2 (weights outside 10-200 kg
        # set to null; https://physionet.org/content/inspire/1.4.2/, the public project page of a
        # release under the Korea Credentialed Health Data License-1-0-0). Only the unit is taken.
        unit: '"kg"'
  height: # Number, Height measured before operation
    code: HEIGHT
    time: $admission_t
    hadm_id: $hadm_id
    numeric_value: $height
    # Source: the column comment; physionet:inspire-1.4.2 Anonymization (height outside 100-200 cm
    # set to null); physionet:inspire-1.4.2 Release Notes 1.4 (height cleaned to cm)
    _metadata:
      _self:
        description: '"Body height measured before the operation, cm (INSPIRE operations.height)"'
        # The unit is not in the data. Source: physionet:inspire-1.4.2 (heights outside 100-200 cm
        # set to null) and its Release Notes 1.4 (height cleaned to cm, mm values corrected);
        # https://physionet.org/content/inspire/1.4.2/, the public project page of a release under
        # the Korea Credentialed Health Data License-1-0-0. Only the unit is taken.
        unit: '"cm"'
  race: # String, Race of the patient
    code: 'f"RACE//{$race ?? ''UNK''}"'
    time: null
    _metadata:
      _self:
        description: >-
          f"Race of the patient: {$race ?? 'UNK'} (INSPIRE operations.race)"
  asa: # 1/2/3/4/5, American Society of Anesthesiologists physical status classification
    code: 'f"ASA//{$asa ?? ''UNK''}"'
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    _metadata:
      _self:
        # The classes paraphrase the ASA Physical Status Classification System (American Society
        # of Anesthesiologists, last amended 2020-12-13).
        description: >-
          "ASA physical status 1, a healthy patient without systemic disease (INSPIRE operations.asa)"
          if $asa::str == '1' else
          "ASA physical status 2, mild systemic disease (INSPIRE operations.asa)"
          if $asa::str == '2' else
          "ASA physical status 3, severe systemic disease (INSPIRE operations.asa)"
          if $asa::str == '3' else
          "ASA physical status 4, severe systemic disease that is a constant threat to life (INSPIRE operations.asa)"
          if $asa::str == '4' else
          "ASA physical status 5, moribund patient not expected to survive without the operation (INSPIRE operations.asa)"
          if $asa::str == '5' else
          "ASA physical status 6, brain-dead patient whose organs are being removed for donation (INSPIRE operations.asa)"
          if $asa::str == '6' else
          f"ASA physical status {$asa ?? 'UNK'} (INSPIRE operations.asa)"
  emop: # Binary, Emergency of the operation
    code: 'f"EMERGENCY_OPERATION//{$emop ?? ''UNK''}"'
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    _metadata:
      _self:
        description: >-
          f"Emergency operation flag: {$emop ?? 'UNK'} (INSPIRE operations.emop, binary indicator of an
          emergency operation)"
  department: # String, Surgical department for admission
    code: 'f"ADMISSION_DEPARTMENT//{$department ?? ''UNK''}"'
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    _metadata:
      # The release's own department.csv spells out each abbreviation.
      department:
        department: $Abbreviations
        description: >-
          f"Surgical department for admission: {$`Full name`} (INSPIRE operations.department
          '{$Abbreviations}', expanded by the release's department.csv)"
  antype: # String, Anesthesia Type (General / Neuraxial / Regional / MAC)
    code: 'f"ANESTHESIA_TYPE//{$antype ?? ''UNK''}"'
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    _metadata:
      _self:
        description: >-
          f"Anesthesia type: {$antype ?? 'UNK'} (INSPIRE operations.antype: General, Neuraxial, Regional,
          or MAC = monitored anesthesia care)"
  icd10_pcs: # String, ICD-10 Procedure Coding System code
    code: 'f"ICD//10PCS//{$icd10_pcs ?? ''UNK''}"'
    time: $opdate_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment; INSPIRE team, 2026-11-22 (in 1.4.2 predicted from the procedure
    # name by a model; v1.5 re-derives it from the ICD-10-PCS 2022 code set)
    _metadata:
      _self:
        description: >-
          f"Operation, ICD-10-PCS code cut to its first five characters (section, body system, root
          operation, body part, approach): {$icd10_pcs ?? 'UNK'} (INSPIRE operations.icd10_pcs; up
          to INSPIRE 1.4.2 predicted from the procedure name by a model)"
  orin_time: # Relative Time, The time for entering the operating room
    code: OR_IN
    time: $orin_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Patient entered the operating room (INSPIRE operations.orin_time)"'
  orout_time: # Relative Time, The time for leaving the operating room
    code: OR_OUT
    time: $orout_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Patient left the operating room (INSPIRE operations.orout_time)"'
  # An operation and an anaesthesia are each two codes, `<FAMILY>//START` and `<FAMILY>//END`, the
  # spelling the MEDS ETLs move to for the two ends of an interval (alignEHR#53). A bare `//` would
  # parse as a division, so these literal codes are quoted strings.
  opstart_time: # Relative Time, The time for starting the operation
    code: '"OPERATION//START"'
    time: $opstart_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations)
    _metadata:
      _self:
        description: '"Start of the operation (INSPIRE operations.opstart_time)"'
  opend_time: # Relative Time, The time for finishing the operation
    code: '"OPERATION//END"'
    time: $opend_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations)
    _metadata:
      _self:
        description: '"End of the operation (INSPIRE operations.opend_time)"'
  admission_time: # Relative Time, The time for hospital admission
    code: HOSPITAL_ADMISSION
    time: $admission_t
    hadm_id: $hadm_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Hospital admission (INSPIRE operations.admission_time)"'
  discharge_time: # Relative Time, The time for hospital discharge
    code: HOSPITAL_DISCHARGE
    time: $discharge_t
    hadm_id: $hadm_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Hospital discharge (INSPIRE operations.discharge_time)"'
  anstart_time: # Relative Time, The time for starting anaesthesia
    code: '"ANESTHESIA//START"'
    time: $anstart_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations)
    _metadata:
      _self:
        description: '"Start of anesthesia (INSPIRE operations.anstart_time)"'
  anend_time: # Relative Time, The time for finishing anaesthesia
    code: '"ANESTHESIA//END"'
    time: $anend_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations)
    _metadata:
      _self:
        description: '"End of anesthesia (INSPIRE operations.anend_time)"'
  cpbon_time: # Relative Time, The time for starting cardiopulmonary bypass
    code: CPB_ON
    time: $cpbon_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"Start of cardiopulmonary bypass (INSPIRE operations.cpbon_time)"'
  cpboff_time: # Relative Time, The time for finishing cardiopulmonary bypass
    code: CPB_OFF
    time: $cpboff_t
    hadm_id: $hadm_id
    operation_id: $op_id
    # Source: the column comment
    _metadata:
      _self:
        description: '"End of cardiopulmonary bypass (INSPIRE operations.cpboff_time)"'
  # INSPIRE team, 2026-11-22: icuin_time/icuout_time are the ICU stay after each operation (ICU
  # stays without surgery are out of scope), but in v1.3-v1.4.2 a stay was linked to operations by
  # patient only, so many linked rows point to a stay of another admission. On 1.4.2, 2,667 of
  # 15,977 distinct ICU stays (16.7%) begin neither during nor within 24 h after any operation of
  # the same admission (README, "Source caveats"). v1.5 links a stay only when it does.
  icuin_time: # Relative Time, The time for ICU admission after surgery
    code: ICU_ADMISSION
    time: $icuin_t
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations: ICU
    # admissions within 24 hours of surgery); INSPIRE team, 2026-11-22 (linked by patient only)
    _metadata:
      _self:
        description: >-
          "ICU admission recorded on an operation (INSPIRE operations.icuin_time); meant as the ICU
          stay after surgery, but up to INSPIRE 1.4.2 linked to operations by patient only, so some
          stays do not follow an operation of the same admission"
  icuout_time: # Relative Time, The time for ICU discharge after surgery
    code: ICU_DISCHARGE
    time: $icuout_t
    # Source: the column comment; physionet:inspire-1.4.2 Data Description (Operations: ICU
    # admissions within 24 hours of surgery); INSPIRE team, 2026-11-22 (linked by patient only)
    _metadata:
      _self:
        description: >-
          "ICU discharge recorded on an operation (INSPIRE operations.icuout_time); meant as the
          end of the ICU stay after surgery, but up to INSPIRE 1.4.2 linked to operations by
          patient only, so some stays do not follow an operation of the same admission"
  death_time: # Relative Time, The time for death
    code: MEDS_DEATH
    time: $date_of_death
    # Source: physionet:inspire-1.4.2 Release Notes 1.3 (all-cause mortality column); INSPIRE
    # team, 2026-11-22 (allcause_death_time is the date the death was registered with the
    # Ministry of the Interior and Safety, linkage of 2023-06-15; inhosp_death_time is the actual
    # time from the EMR); the inspire_subject_table pre-stage (README Birth and death)
    _metadata:
      _self:
        description: >-
          "Death (MEDS standard code); the in-hospital death time from the EMR
          (operations.inhosp_death_time) where there is one, else 00:00 of the date the death was
          registered with the Korean Ministry of the Interior and Safety (allcause_death_time, a
          median of about 11 days after the death; follow-up to 2023-06-15). About 2% of patients
          could not be linked to the registry, so no event means no recorded death, not survival"

labs:
  _table:
    joins:
      parameters:
        left_on: item_name
        right_on: Label
        cols: { Unit: min, Description: min }
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      chart_t: "$_origin + $chart_time::minutes"
      # The unit as the code's last segment: stripped of surrounding whitespace, and `UNK` where it
      # is missing or blank. MEDS-Extract compares units the same way when it writes `unit` in
      # `codes.parquet` (stripped, blanks dropped), so ` mg` and `mg` give one code. dftly 0.7 has
      # no strip function, so the extract takes the text from the first to the last non-whitespace
      # character (`(?s)` lets it span line breaks), which is null when there is none. `vitals` and
      # `ward_vitals` use the same helper.
      _value_unit: '(extract /(?s)\S(?:.*\S)?/ from $Unit) ?? "UNK"'
  lab:
    code: 'f"LAB//{$item_name ?? ''UNK''}//{$_value_unit}"'
    time: $chart_t
    numeric_value: $value
    _metadata:
      _self:
        description: $Description
        # The unit of numeric_value: the release's parameters.csv Unit, as recorded (MEDS-Extract
        # strips it). It is also the code's last segment, so one value per code; a null or blank
        # Unit (code `//UNK`) stays null.
        unit: $Unit

medications:
  _table:
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      chart_t: "$_origin + $chart_time::minutes"
  # INSPIRE team, 2026-11-22: the table holds administered orders (drug, route, time); doses and
  # amounts were not extracted. A combination product is one row per component, and the released
  # file has only `drug_name` and `atc_code` (the `drug_name2/3` and `atc_code2/3` of schema.csv
  # are an error in schema.csv).
  medication:
    code: 'f"MEDICATION//{$atc_code ?? ''UNK''}//{$route}"'
    time: $chart_t
    text_value: $drug_name
    _metadata:
      _self:
        description: >-
          f"Medication administered, WHO ATC code {$atc_code ?? 'UNK'}, route {$route} (INSPIRE
          medications.atc_code and route; the ingredient name is in text_value). An administered
          order without dose or amount; a combination product is one event per component"

diagnosis:
  _table:
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      chart_t: "$_origin + $chart_time::minutes"
  # INSPIRE team, 2026-11-22: `icd10_cm` holds the codes recorded in the SNUH EMR in the Korean
  # Standard Classification of Diseases (KCD, based on WHO ICD-10 with Korean additions), in the
  # edition in force on the diagnosis date (KCD-6 to 2015, KCD-7 from 2016, KCD-8 from 2021),
  # cut to the first three characters. Most coincide with ICD-10-CM categories; 71 in 1.4.2 do not
  # (rvandewater/INSPIRE_MEDS#30). `chart_time` is 00:00 of the diagnosis date recorded in the
  # EMR, not the time the diagnosis was made; a diagnosis entered at or after discharge can carry
  # a date after the clinical event. The code keeps its `ICD//10CM` label for now (README, "Source
  # caveats").
  diagnosis:
    code: 'f"DIAGNOSIS//ICD//10CM//{$icd10_cm ?? ''UNK''}"'
    time: $chart_t
    # No `_metadata`: suMEDS adds the ICD-10-CM category title and parents (sumeds_rules.yaml). A
    # description here would replace those titles (suMEDS fills only missing descriptions).

vitals:
  _table:
    joins:
      parameters:
        left_on: item_name
        right_on: Label
        cols: { Unit: min, Description: min }
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      chart_t: "$_origin + $chart_time::minutes"
      # The unit as the code's last segment, stripped; `UNK` if missing or blank (see `labs`).
      _value_unit: '(extract /(?s)\S(?:.*\S)?/ from $Unit) ?? "UNK"'
  vital:
    code: 'f"VITAL//{$item_name ?? ''UNK''}//{$_value_unit}"'
    time: $chart_t
    numeric_value: $value
    _metadata:
      _self:
        description: $Description
        # The unit of numeric_value: the release's parameters.csv Unit, as recorded (MEDS-Extract
        # strips it). It is also the code's last segment, so one value per code; a null or blank
        # Unit (code `//UNK`) stays null.
        unit: $Unit

ward_vitals:
  _table:
    joins:
      parameters:
        left_on: item_name
        right_on: Label
        cols: { Unit: min, Description: min }
    cols:
      _origin: '("2016-01-01"::?"%Y-%m-%d")::datetime'
      chart_t: "$_origin + $chart_time::minutes"
      # The unit as the code's last segment, stripped; `UNK` if missing or blank (see `labs`).
      _value_unit: '(extract /(?s)\S(?:.*\S)?/ from $Unit) ?? "UNK"'
  ward_vital:
    code: 'f"WARD_VITAL//{$item_name ?? ''UNK''}//{$_value_unit}"'
    time: $chart_t
    numeric_value: $value
    _metadata:
      _self:
        description: $Description
        # The unit of numeric_value: the release's parameters.csv Unit, as recorded (MEDS-Extract
        # strips it). It is also the code's last segment, so one value per code; a null or blank
        # Unit (code `//UNK`) stays null.
        unit: $Unit
